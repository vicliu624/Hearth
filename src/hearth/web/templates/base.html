<!doctype html>
<html lang="{{ locale or 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#eef3e5">
    <title>{{ title or "Hearth" }} · Hearth</title>
    <link rel="icon" href="/static/logo-small.png">
    <link rel="stylesheet" href="/static/island/hearth.css?v={{ asset_revision }}">
    <script type="module" src="/static/island/hearth.js?v={{ asset_revision }}"></script>
  </head>
  <body>
    {% set state = header_state or {} %}
    <script id="hearth-shell" type="application/json">{{ {
      "locale": locale or 'zh-CN',
      "title": title or 'Hearth',
      "nav": nav_links,
      "languages": languages,
      "node": state.get('node_name', 'Hearth'),
      "health": state.get('health_status', 'unknown'),
      "runtime": state.get('runtime_status', 'unknown'),
      "uptime": state.get('uptime_compact', '--'),
      "authenticated": admin_authenticated,
      "authEnabled": auth_enabled,
      "permissions": granted_permissions,
      "responseStatus": response_status,
      "login": login_href,
      "logout": logout_href,
      "sampledAt": sampled_at,
      "observation": observation_status,
      "stale": observation_stale,
      "version": '0.2.0'
    } | tojson }}</script>
    <script id="hearth-page" type="application/json">{{ page_data | tojson }}</script>
    <div id="hearth-app">
      <div class="boot-screen" role="status">{{ t('app.loading') }}</div>
      <main id="server-content" hidden>
        {% if notice %}<section class="flash flash-{{ notice.kind }}">{{ notice.message }}</section>{% endif %}
        {% block content %}{% endblock %}
      </main>
    </div>
    <noscript><style>#server-content[hidden]{display:block}.boot-screen{display:none}</style><p>Hearth: {{ t('action.login') }} <a href="{{ login_href }}">{{ login_href }}</a></p></noscript>
  </body>
</html>
