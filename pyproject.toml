[build-system]
requires = ["hatchling>=1.32.4,<2"]
build-backend = "hatchling.build"

[project]
name = "hearth"
version = "0.2.0"
description = "Hearth: a control plane for Personal Reticulum Transport Nodes"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "Vic Liu" },
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "fastapi>=0.142.1,<1",
  "jinja2>=3.1.6,<4",
  "pydantic>=2.13.5,<3",
  "psutil>=7.2.2,<8",
  "sqlalchemy>=2.1.1,<3",
  "tomli-w>=1.2.0,<2",
  "typer>=0.27.2,<1",
  "uvicorn[standard]>=0.54.0,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1,<1",
  "pytest>=9.1.1,<10",
]
reticulum = ["rns>=1.5.5,<2"]

[project.scripts]
hearth = "hearth.cli.main:main"
hearth-api = "hearth.core.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hearth"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
